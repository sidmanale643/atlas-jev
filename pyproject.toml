[project]
name = "jev-mem"
version = "0.1.0"
description = "Memory mechanism: OpenRouter LLM extraction, Jev gating via OpenRouter Decisions API, local LanceDB vector store"
requires-python = ">=3.11"
dependencies = [
    "typesafe-sdk",
    "lancedb",
    "fastembed",
    "httpx",
    "openai>=1.0",
    "python-dotenv",
]

[project.scripts]
jev-mem = "jev_mem.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jev_mem"]
